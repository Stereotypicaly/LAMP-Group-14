<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts &mdash; Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="dashboard">
    <div class="dashboard__tab">Administrator</div>
    <div class="card__holes" aria-hidden="true">
      <span class="hole"></span><span class="hole"></span><span class="hole"></span>
    </div>

    <header class="dashboard__header">
      <div>
        <h1>Users</h1>
        <p class="dashboard__intro">View and manage registered accounts.</p>
      </div>
      <div class="dashboard__header-actions">
        <a href="create-user.html" class="button button--add" aria-label="Create a user">+</a>
        <button type="button" id="sign-out-button" class="button button--secondary">Sign out</button>
      </div>
    </header>

    <section aria-labelledby="users-heading">
      <h2 id="users-heading" class="sr-only">Registered users</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th scope="col">ID</th><th scope="col">First name</th><th scope="col">Last name</th>
              <th scope="col">Username</th><th scope="col">Created</th><th scope="col">Updated</th><th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7">Loading users...</td></tr>
          </tbody>
        </table>
        <p id="users-message" class="form-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <dialog id="reset-password-dialog" class="reset-password-dialog" aria-labelledby="reset-password-heading">
    <form id="reset-password-form" method="dialog">
      <h2 id="reset-password-heading">Reset password</h2>
      <p id="reset-password-user" class="dashboard__intro"></p>
      <label for="new-password">New password</label>
      <input id="new-password" name="newPassword" type="password" required autocomplete="new-password">
      <div class="dialog-actions">
        <button type="button" id="cancel-reset-button" class="button button--secondary">Cancel</button>
        <button type="submit" class="button">Reset password</button>
      </div>
    </form>
  </dialog>

  <script src="js/admin.js"></script>
</body>
</html>
