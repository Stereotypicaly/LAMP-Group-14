<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts &mdash; Create Contact</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="card card--form-page">
    <div class="card__tab">Contacts</div>

    <div class="card__holes" aria-hidden="true">
      <span class="hole"></span>
      <span class="hole"></span>
      <span class="hole"></span>
    </div>

    <p class="card__intro">Create a contact</p>

    <form class="card__form" id="create-contact-form">
      <div class="field">
        <label for="first-name">First name</label>
        <input type="text" id="first-name" name="firstName" autocomplete="given-name" required maxlength="50">
      </div>

      <div class="field">
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" name="lastName" autocomplete="family-name" required maxlength="50">
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="emailAddress" autocomplete="email" required maxlength="50">
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required maxlength="25" pattern="[0-9+(). -]+" title="Enter a valid 10-digit phone number.">
      </div>

      <button type="submit" class="card__submit">Save contact</button>
      <p id="create-contact-message" class="form-message" aria-live="polite"></p>
      <a class="card__forgot" href="user.html">Cancel</a>
    </form>
  </main>

  <script src="js/create-contact.js"></script>
</body>
</html>
