<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts &mdash; My Contacts</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="dashboard">
    <div class="dashboard__tab">User</div>
    <div class="card__holes" aria-hidden="true">
      <span class="hole"></span><span class="hole"></span><span class="hole"></span>
    </div>

    <header class="dashboard__header">
      <div>
        <p class="dashboard__eyebrow">My address book.</p>
        <h1>My Contacts.</h1>
      </div>
      <div class="dashboard__header-actions">
        <a href="create-contact.html" class="button button--add" aria-label="Add a contact">+</a>
        <button type="button" id="sign-out-button" class="button button--secondary">Sign out</button>
      </div>
    </header>

    <section aria-labelledby="contacts-heading">
      <h2 id="contacts-heading" class="sr-only">My contacts</h2>
      <form id="contact-search-form" class="contacts-search" role="search">
        <label class="sr-only" for="contact-search">Search contacts</label>
        <input id="contact-search" name="search" type="search" placeholder="Search name, email, or phone" autocomplete="off">
        <button type="submit" class="button button--small">Search</button>
        <button type="button" id="clear-search-button" class="button button--small button--secondary">Clear</button>
      </form>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th scope="col">First name</th><th scope="col">Last name</th><th scope="col">Email</th>
              <th scope="col">Phone</th><th scope="col">Created</th><th scope="col">Updated</th><th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7">Loading contacts...</td></tr>
          </tbody>
        </table>
        <p id="contacts-message" class="form-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <dialog id="edit-contact-dialog" class="edit-contact-dialog" aria-labelledby="edit-contact-title" aria-describedby="edit-contact-description">
    <form id="edit-contact-form" method="dialog">
      <h2 id="edit-contact-title">Edit contact</h2>
      <p id="edit-contact-description" class="dialog-intro">Update this contact's details.</p>

      <div class="field">
        <label for="edit-first-name">First name</label>
        <input type="text" id="edit-first-name" name="firstName" autocomplete="given-name" required maxlength="50">
      </div>
      <div class="field">
        <label for="edit-last-name">Last name</label>
        <input type="text" id="edit-last-name" name="lastName" autocomplete="family-name" required maxlength="50">
      </div>
      <div class="field">
        <label for="edit-email">Email address</label>
        <input type="email" id="edit-email" name="emailAddress" autocomplete="email" required maxlength="50">
      </div>
      <div class="field">
        <label for="edit-phone">Phone number</label>
        <input type="tel" id="edit-phone" name="phone" autocomplete="tel" inputmode="tel" required maxlength="25" pattern="[0-9+(). -]+" title="Enter a valid 10-digit phone number.">
      </div>

      <p id="edit-contact-message" class="form-message" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-edit-contact" class="button button--small button--secondary">Cancel</button>
        <button type="submit" id="save-edit-contact" class="button button--small">Save changes</button>
      </div>
    </form>
  </dialog>

  <script src="js/user.js"></script>
</body>
</html>
